[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencontextplatform"
version = "0.1.0"
description = "OpenContextPlatform reference implementation for AI context handling, connectors, providers, and runtime orchestration."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "OpenContextPlatform" }
]
license = { text = "Apache-2.0" }
keywords = ["opencontext", "ai", "context", "provider", "connector", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.0",
  "mypy>=1.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "runtime*", "packages*"]
