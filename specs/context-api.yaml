openapi: 3.0.3
info:
  title: OpenContextPlatform Context API
  description: The REST API for the OpenContextPlatform Context Engine, enabling memory, retrieval, ranking, and graph interactions.
  version: 0.1.0-alpha
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
paths:
  /context:
    post:
      summary: Ingest new context
      description: Ingests new semantic or episodic memory into the knowledge graph and vector index.
      operationId: ingestContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextObject'
      responses:
        '201':
          description: Context created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextObject'
  /search:
    post:
      summary: Hybrid Retrieval (Vector + Graph)
      description: Retrieve context using a mix of semantic vector similarity and graph structural traversal.
      operationId: searchContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Ranked search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
  /memories/{tenant_id}:
    get:
      summary: Get Memory Collections
      description: Retrieve episodic and semantic memories for a given tenant.
      operationId: getMemories
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContextObject'
  /webhooks/{provider}:
    post:
      summary: Real-time event ingestion webhook
      description: Webhook endpoint for connectors to push streaming context events.
      operationId: handleWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: The connector provider (e.g., github, slack)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
      responses:
        '202':
          description: Webhook accepted for asynchronous processing

components:
  schemas:
    ContextObject:
      type: object
      required:
        - id
        - tenant_id
        - type
      properties:
        id:
          type: string
          description: Unique identifier (UUIDv4)
        tenant_id:
          type: string
          description: Organization or user tenant boundary
        type:
          type: string
          enum: [semantic, episodic, procedural, generic]
        content:
          type: string
          description: The raw text or payload of the context node
        metadata:
          type: object
          additionalProperties: true
          description: Key-value metadata for filtering and graph attributes
        embedding:
          type: array
          items:
            type: number
          description: The dense vector representation of the content
    SearchRequest:
      type: object
      required:
        - query
        - tenant_id
      properties:
        query:
          type: string
          description: The natural language search query
        tenant_id:
          type: string
          description: Tenant boundary for the search
        hybrid_weight:
          type: number
          default: 0.5
          description: Weight between 0 (Graph only) and 1 (Vector only)
        top_k:
          type: integer
          default: 10
          description: Max number of results to return
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ContextObject'
        ranked_scores:
          type: object
          additionalProperties:
            type: number
          description: Map of Context IDs to their final reranked score
    WebhookPayload:
      type: object
      properties:
        event_type:
          type: string
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
